name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run hebdomadaire : le restore NuGet audite les dépendances (NU1902/NU1903 en Warning-As-Error).
  # Une advisory publiée entre deux pushs ne se voit sinon qu'au push suivant (vécu : CI rouge
  # du 10/09/2026 sur des advisories publiées de fin juin à mi-septembre). Lundi 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un groupe par (ref, événement) : un push sur main n'annule pas le run planifié, et inversement.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Backend uniquement : les têtes clientes ont leur propre workflow (Atlas.App → uno.yml ;
      # Atlas.Maui abandonné par ADR-029, jamais construit ici : workload mobile requis).
      # Atlas.Api tire transitivement Domain, Application, Shared et tous les Infrastructure.*.
      - name: Build backend (Release)
        run: dotnet build src/Atlas.Api/Atlas.Api.csproj -c Release

      # Client web Blazor Web App (hôte Atlas.Web + Atlas.Web.Client WASM). Pas de workload
      # mobile ici ; un `build` (sans publish AOT) ne requiert pas wasm-tools.
      - name: Build web client (Release)
        run: dotnet build src/Atlas.Web/Atlas.Web.csproj -c Release

      # Tests unitaires + architecture (rapides, sans Docker).
      - name: Unit & architecture tests
        run: |
          dotnet test tests/Atlas.Domain.UnitTests/Atlas.Domain.UnitTests.csproj -c Release \
            --collect:"XPlat Code Coverage" --results-directory TestResults
          dotnet test tests/Atlas.Application.UnitTests/Atlas.Application.UnitTests.csproj -c Release \
            --collect:"XPlat Code Coverage" --results-directory TestResults
          dotnet test tests/Atlas.Infrastructure.Security.UnitTests/Atlas.Infrastructure.Security.UnitTests.csproj -c Release \
            --collect:"XPlat Code Coverage" --results-directory TestResults
          dotnet test tests/Atlas.Infrastructure.Messaging.UnitTests/Atlas.Infrastructure.Messaging.UnitTests.csproj -c Release \
            --collect:"XPlat Code Coverage" --results-directory TestResults
          dotnet test tests/Atlas.Shared.UnitTests/Atlas.Shared.UnitTests.csproj -c Release \
            --collect:"XPlat Code Coverage" --results-directory TestResults
          dotnet test tests/Atlas.Infrastructure.Storage.UnitTests/Atlas.Infrastructure.Storage.UnitTests.csproj -c Release \
            --collect:"XPlat Code Coverage" --results-directory TestResults
          dotnet test tests/Atlas.Architecture.Tests/Atlas.Architecture.Tests.csproj -c Release

      # Tests d'intégration : PostgreSQL réel (Testcontainers) + INPI/RSS mockés (WireMock).
      # Le runner ubuntu-latest fournit un daemon Docker.
      - name: Integration tests (Docker)
        run: |
          dotnet test tests/Atlas.Infrastructure.Persistence.IntegrationTests/Atlas.Infrastructure.Persistence.IntegrationTests.csproj -c Release
          dotnet test tests/Atlas.Infrastructure.Veille.IntegrationTests/Atlas.Infrastructure.Veille.IntegrationTests.csproj -c Release
          dotnet test tests/Atlas.Infrastructure.Inpi.IntegrationTests/Atlas.Infrastructure.Inpi.IntegrationTests.csproj -c Release
          dotnet test tests/Atlas.Api.IntegrationTests/Atlas.Api.IntegrationTests.csproj -c Release

      # Rapport de couverture (informatif, non bloquant).
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # Le build des têtes Uno (Atlas.App) est dans un workflow séparé (.github/workflows/uno.yml),
  # filtré par paths : inutile de relancer les workloads Uno (emscripten, ~4 min) sur les PR
  # qui ne touchent ni Atlas.App ni ses dépendances Domain/Shared.
