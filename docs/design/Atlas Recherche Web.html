<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { RechercheWeb } = window;

// Cadre de fenêtre — pour situer l'échelle (n'est pas un composant du produit).
function WindowFrame({ w, h, dark, children }) {
  const bar = dark ? '#0D1722' : '#E7EFF8';
  const dot = dark ? '#2C3E50' : '#B9CCDF';
  return (
    <div style={{ width:w, height:h, display:'flex', flexDirection:'column',
      borderRadius:14, overflow:'hidden', boxShadow:'0 1px 2px rgba(19,32,46,0.06), 0 18px 50px rgba(19,32,46,0.16)',
      border:`1px solid rgba(19,32,46,0.10)` }}>
      <div style={{ flexShrink:0, height:38, background:bar, display:'flex', alignItems:'center',
        gap:7, padding:'0 14px', borderBottom:`1px solid rgba(19,32,46,0.08)` }}>
        <span style={{ width:11, height:11, borderRadius:'50%', background:dot }} />
        <span style={{ width:11, height:11, borderRadius:'50%', background:dot }} />
        <span style={{ width:11, height:11, borderRadius:'50%', background:dot }} />
        <span style={{ marginLeft:12, fontFamily:'IBM Plex Mono, monospace', fontSize:12,
          color: dark ? '#5A7490' : '#7E97AE' }}>atlas.app/recherche?q=beaumont&type=entreprise</span>
      </div>
      <div style={{ flex:1, minHeight:0 }}>{children}</div>
    </div>
  );
}

const DW = 1440, DH = 904, NW = 700, NH = 880;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="large" title="Format large (~1440 px) — list-detail"
        subtitle="Rail latéral · liste pleine largeur de sa zone (scan dense) · détail à largeur PLAFONNÉE (~720px, aligné à gauche, jamais étiré). Les lignes sont vivantes : cliquez une entreprise à gauche, la fiche se met à jour à droite sans changer de page. ↑/↓ navigue, Entrée ouvre.">
        <DCArtboard id="desktop-clair" label="Desktop · clair" width={DW} height={DH}>
          <WindowFrame w={DW} h={DH} dark={false}><RechercheWeb dark={false} layout="desktop" /></WindowFrame>
        </DCArtboard>
        <DCArtboard id="desktop-sombre" label="Desktop · sombre" width={DW} height={DH}>
          <WindowFrame w={DW} h={DH} dark={true}><RechercheWeb dark={true} layout="desktop" /></WindowFrame>
        </DCArtboard>
      </DCSection>

      <DCSection id="reduite" title="Fenêtre réduite (~700 px) — empilement (R2)"
        subtitle="Sous le point de rupture, le rail devient une barre d'onglets en bas et le list-detail retombe en empilement : on voit la liste seule, et cliquer un résultat amène à la fiche en plein écran avec un retour. Même contenu, présentation empilée. La liste de la maquette « Liste » est cliquable → bascule vers la fiche.">
        <DCArtboard id="reduite-liste" label="Fenêtre réduite · liste seule" width={NW} height={NH}>
          <WindowFrame w={NW} h={NH} dark={false}><RechercheWeb dark={false} layout="narrow" initialView="list" /></WindowFrame>
        </DCArtboard>
        <DCArtboard id="reduite-fiche" label="Fenêtre réduite · fiche plein écran (+ retour)" width={NW} height={NH}>
          <WindowFrame w={NW} h={NH} dark={false}><RechercheWeb dark={false} layout="narrow" initialView="detail" initialSelected="e1" /></WindowFrame>
        </DCArtboard>
        <DCArtboard id="reduite-sombre" label="Fenêtre réduite · liste · sombre" width={NW} height={NH}>
          <WindowFrame w={NW} h={NH} dark={true}><RechercheWeb dark={true} layout="narrow" initialView="list" /></WindowFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
