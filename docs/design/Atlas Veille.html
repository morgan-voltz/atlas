<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;
const { VeilleScreen } = window;

const W = 402, H = 874;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="moments" title="Veille — flux de lecture éditoriale"
        subtitle="Un flux de lecture (presse, réglementaire, sectoriel) — pas un fil de mouvements d'entreprises. Le filtre actif reste visible même panneau replié ; l'ouvrir révèle les packs métier et sources libres. Non-lu = pastille + graisse (jamais la couleur seule). Touchez le titre d'un article pour l'ouvrir, le bouton-filtre pour le panneau.">
        <DCArtboard id="lecture" label="Moment 1 · lecture (panneau replié)" width={W} height={H}>
          <IOSDevice dark={false}><VeilleScreen dark={false} /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="gestion" label="Moment 2 · panneau de filtres ouvert" width={W} height={H}>
          <IOSDevice dark={false}><VeilleScreen dark={false} panelOpen={true} /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="lecture-item" title="Vue lecture d'un item"
        subtitle="Titre, source + date, extrait complet, lien externe explicite « Lire sur [source] ↗ », et — si l'article mentionne une entreprise — un encart de mention présenté comme une SUGGESTION à vérifier, jamais comme une affirmation.">
        <DCArtboard id="item-light" label="Lecture · clair" width={W} height={H}>
          <IOSDevice dark={false}><VeilleScreen dark={false} view="reading" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="item-dark" label="Lecture · sombre" width={W} height={H}>
          <IOSDevice dark={true}><VeilleScreen dark={true} view="reading" /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="sombre" title="Mode sombre"
        subtitle="Les deux moments sur les tokens sombres d'Atlas.">
        <DCArtboard id="lecture-dark" label="Lecture (panneau replié)" width={W} height={H}>
          <IOSDevice dark={true}><VeilleScreen dark={true} /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="gestion-dark" label="Panneau de filtres ouvert" width={W} height={H}>
          <IOSDevice dark={true}><VeilleScreen dark={true} panelOpen={true} /></IOSDevice>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
