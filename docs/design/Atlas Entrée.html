<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;
const { AuthScreen } = window;

const W = 402, H = 874;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="entree" title="Écrans d'entrée"
        subtitle="Sobre, institutionnel, beaucoup de blanc. Le bleu est la couleur de marque/action (jamais d'alerte). Champs à labels explicites, mot de passe jamais affiché en clair. Les écrans sont vivants et reliés : « Se connecter » / « Créer un compte » naviguent, le ‹ retour fonctionne.">
        <DCArtboard id="ouverture" label="1 · Ouverture (choix)" width={W} height={H}>
          <IOSDevice dark={false}><AuthScreen dark={false} screen="ouverture" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="connexion" label="2 · Connexion" width={W} height={H}>
          <IOSDevice dark={false}><AuthScreen dark={false} screen="connexion" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="creation" label="3 · Création de compte" width={W} height={H}>
          <IOSDevice dark={false}><AuthScreen dark={false} screen="creation" /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="intermediaires" title="Écrans intermédiaires"
        subtitle="Vérification email, défi 2FA (6 cases, clavier numérique), et proposition INPI (action différable, identifiants chiffrés jamais affichés).">
        <DCArtboard id="verif" label="4 · Vérification email" width={W} height={H}>
          <IOSDevice dark={false}><AuthScreen dark={false} screen="verif" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="twofa" label="5 · Défi 2FA" width={W} height={H}>
          <IOSDevice dark={false}><AuthScreen dark={false} screen="twofa" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="inpi" label="6 · Proposition INPI" width={W} height={H}>
          <IOSDevice dark={false}><AuthScreen dark={false} screen="inpi" /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="sombre" title="Mode sombre"
        subtitle="Le parcours sur les tokens sombres d'Atlas.">
        <DCArtboard id="ouverture-dark" label="Ouverture" width={W} height={H}>
          <IOSDevice dark={true}><AuthScreen dark={true} screen="ouverture" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="connexion-dark" label="Connexion" width={W} height={H}>
          <IOSDevice dark={true}><AuthScreen dark={true} screen="connexion" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="twofa-dark" label="Défi 2FA" width={W} height={H}>
          <IOSDevice dark={true}><AuthScreen dark={true} screen="twofa" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="inpi-dark" label="Proposition INPI" width={W} height={H}>
          <IOSDevice dark={true}><AuthScreen dark={true} screen="inpi" /></IOSDevice>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
