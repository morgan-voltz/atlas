<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: #ece7e1; }

  .atlas-sk { position: relative; overflow: hidden; }
  .atlas-sk::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: atlas-shimmer 1.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .atlas-sk::after { animation: none; } }
  @keyframes atlas-shimmer { 100% { transform: translateX(100%); } }

  .atlas-row:focus-visible, .atlas-field:focus-within {
    outline: 2.5px solid var(--atlas-focus, #1565C0);
    outline-offset: -2px; border-radius: 12px;
  }
</style>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;
const { SearchScreen } = window;

const W = 402, H = 874;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="etats" title="Recherche — deux états d'un champ unique"
        subtitle="Le champ détecte ET affiche l'intention. 9 chiffres valides → État A (carte d'accès direct, proposée, pas d'auto-ouverture). Texte → État B (segments Entreprises/Marques + liste réactive). Les champs sont vivants : tapez dedans pour voir l'état basculer.">
        <DCArtboard id="a-siren" label="A · SIREN détecté (accès direct)" width={W} height={H}>
          <IOSDevice dark={false}><SearchScreen dark={false} initial="552 032 534" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="b-texte" label="B · Texte (segments + liste)" width={W} height={H}>
          <IOSDevice dark={false}><SearchScreen dark={false} initial="beaumont" /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="liste" title="États de la liste (recherche par nom)"
        subtitle="Chargement (squelette de lignes calqué sur la carte-aperçu) et état vide. La ligne en diffusion restreinte n'est jamais masquée — c'est un fait de couverture.">
        <DCArtboard id="chargement" label="Chargement · squelette" width={W} height={H}>
          <IOSDevice dark={false}><SearchScreen dark={false} initial="beaumont" mode="loading" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="vide" label="Vide · aucun résultat" width={W} height={H}>
          <IOSDevice dark={false}><SearchScreen dark={false} initial="zxqwv" mode="empty" /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="sombre" title="Mode sombre"
        subtitle="Les deux états sur les tokens sombres d'Atlas.">
        <DCArtboard id="a-dark" label="A · SIREN détecté" width={W} height={H}>
          <IOSDevice dark={true}><SearchScreen dark={true} initial="552 032 534" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="b-dark" label="B · Texte" width={W} height={H}>
          <IOSDevice dark={true}><SearchScreen dark={true} initial="beaumont" /></IOSDevice>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
