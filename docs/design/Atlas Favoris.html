<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;
const { FavorisScreen } = window;

const W = 402, H = 874;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="moments" title="Favoris — gestion du portefeuille surveillé"
        subtitle="Écran de gestion (pas un fil : aucun badge « nouveauté »). Sélecteur de puces défilable ; « Tous » par défaut. Choisir une liste révèle EN PLUS les filtres par tag (libellé + pastille, jamais la couleur seule) et l'accès à sa timeline filtrée. Les puces et tags sont navigables au clavier.">
        <DCArtboard id="tous" label="« Tous » · le portefeuille" width={W} height={H}>
          <IOSDevice dark={false}><FavorisScreen dark={false} initialList="tous" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="liste" label="Liste « Concurrence » ouverte" width={W} height={H}>
          <IOSDevice dark={false}><FavorisScreen dark={false} initialList="concurrence" /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="actions" title="Actions sur une carte"
        subtitle="Le kebab ⋮ est TOUJOURS visible — c'est la voie accessible (Retirer du suivi · Ajouter à une liste). Le swipe vers la gauche est un simple raccourci qui révèle « Retirer » (rouge = action système destructive, pas un jugement sur l'entité). Ici, la 1ʳᵉ carte montre le menu ouvert, la 2ᵉ le swipe révélé.">
        <DCArtboard id="actions-demo" label="Kebab ouvert + swipe révélé" width={W} height={H}>
          <IOSDevice dark={false}><FavorisScreen dark={false} initialList="tous" demo={true} /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="vides" title="États vides"
        subtitle="Vide global (nouveau compte → boucle chercher/suivre) et vide d'une liste (ajouter ou importer des SIREN).">
        <DCArtboard id="vide-global" label="Vide global · aucun favori" width={W} height={H}>
          <IOSDevice dark={false}><FavorisScreen dark={false} mode="empty-global" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="vide-liste" label="Vide d'une liste" width={W} height={H}>
          <IOSDevice dark={false}><FavorisScreen dark={false} mode="empty-list" /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="sombre" title="Mode sombre"
        subtitle="Les deux moments sur les tokens sombres d'Atlas.">
        <DCArtboard id="tous-dark" label="« Tous »" width={W} height={H}>
          <IOSDevice dark={true}><FavorisScreen dark={true} initialList="tous" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="liste-dark" label="« Concurrence »" width={W} height={H}>
          <IOSDevice dark={true}><FavorisScreen dark={true} initialList="concurrence" /></IOSDevice>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
