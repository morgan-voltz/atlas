const W = 402, H = 874;

function App() {

        <DCArtboard id="fiche-dark" label="Sombre" width={W} height={H}>
          <IOSDevice dark={true}><FicheScreen dark={true} /></IOSDevice>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
