<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: #ece7e1; }

  /* squelette : animation discrète, désactivée si reduced-motion */
  .atlas-sk { position: relative; overflow: hidden; }
  .atlas-sk::after {
    content: ""; position: absolute; inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: atlas-shimmer 1.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .atlas-sk::after { animation: none; }
  }
  @keyframes atlas-shimmer { 100% { transform: translateX(100%); } }

  /* focus visible : anneau (token focus), jamais une simple couleur */
  .atlas-row:focus-visible {
    outline: 2.5px solid var(--atlas-focus, #1565C0);
    outline-offset: -2px; border-radius: 12px;
  }
</style>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;
const { FeedScreen, EmptyScreen, LoadingScreen, EndScreen, ErrorScreen } = window;

const W = 402, H = 874;
const Phone = ({ dark, children }) => (
  <IOSDevice dark={dark}>{children}</IOSDevice>
);

function App() {
  return (
    <DesignCanvas>
      <DCSection id="retenu" title="Fil Accueil — C · Rail chronologique"
        subtitle="Variante retenue. Timeline regroupée par date, nœuds lu/non-lu (pastille + graisse), libellé d'événement mis en avant, source + date sur la ligne méta. Toute la ligne tappable (≥ 44 px) ; libellé = fait.">
        <DCArtboard id="c-light" label="Clair" width={W} height={H}>
          <Phone dark={false}><FeedScreen variant="C" dark={false} /></Phone>
        </DCArtboard>
        <DCArtboard id="c-dark" label="Sombre" width={W} height={H}>
          <Phone dark={true}><FeedScreen variant="C" dark={true} /></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="etats" title="États du fil (sur la base C)"
        subtitle="Vide d'onboarding (amorce la boucle chercher → suivre), squelette calqué sur l'anatomie de la ligne, fin de liste « à jour », et erreur de SOURCE — un élément local : le fil agrège plusieurs sources, si l'une tombe le reste s'affiche. success/error réservés aux états système.">
        <DCArtboard id="vide" label="Vide · onboarding" width={W} height={H}>
          <Phone dark={false}><EmptyScreen dark={false} /></Phone>
        </DCArtboard>
        <DCArtboard id="chargement" label="Chargement · squelette" width={W} height={H}>
          <Phone dark={false}><LoadingScreen dark={false} /></Phone>
        </DCArtboard>
        <DCArtboard id="fin" label="Fin de liste · à jour" width={W} height={H}>
          <Phone dark={false}><EndScreen dark={false} /></Phone>
        </DCArtboard>
        <DCArtboard id="erreur-source" label="Erreur de source (locale)" width={W} height={H}>
          <Phone dark={false}><ErrorScreen dark={false} /></Phone>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
