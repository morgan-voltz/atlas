<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;
const { ProfilScreen } = window;

const W = 402, H = 874;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="hub" title="Profil — hub de réglages"
        subtitle="Un menu qui mène à des sous-pages (pas une longue page en vrac). Deux familles introduites par un intitulé ; le badge « Connecté » est un état système discret (texte + icône, jamais alarmant). « Se déconnecter » est détaché en bas — c'est une action, pas un réglage. Touchez « Connexion INPI » ou « Données & confidentialité » pour ouvrir la sous-page.">
        <DCArtboard id="hub-light" label="Hub · clair" width={W} height={H}>
          <IOSDevice dark={false}><ProfilScreen dark={false} /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="hub-dark" label="Hub · sombre" width={W} height={H}>
          <IOSDevice dark={true}><ProfilScreen dark={true} /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="inpi" title="Sous-page · Connexion INPI"
        subtitle="Bloc de statut « Connecté · testé le 28 mai 2026 », identifiant masqué (jamais le mot de passe), « Tester la connexion » / « Déconnecter », et la note de chiffrement.">
        <DCArtboard id="inpi-light" label="Connexion INPI · clair" width={W} height={H}>
          <IOSDevice dark={false}><ProfilScreen dark={false} view="inpi" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="inpi-dark" label="Connexion INPI · sombre" width={W} height={H}>
          <IOSDevice dark={true}><ProfilScreen dark={true} view="inpi" /></IOSDevice>
        </DCArtboard>
      </DCSection>

      <DCSection id="data" title="Sous-page · Données & confidentialité"
        subtitle="Carte normale « Exporter mes données » en haut ; zone danger (bordure rouge) nettement détachée en bas, avec un texte honnête sur l'effacement et la conservation légale.">
        <DCArtboard id="data-light" label="Données · clair" width={W} height={H}>
          <IOSDevice dark={false}><ProfilScreen dark={false} view="data" /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="data-dark" label="Données · sombre" width={W} height={H}>
          <IOSDevice dark={true}><ProfilScreen dark={true} view="data" /></IOSDevice>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
